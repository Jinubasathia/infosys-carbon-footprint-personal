server.port=8080
server.servlet.context-path=/

spring.application.name=carbon-footprint-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/carbonfootprint
spring.datasource.username=DATABASE_USERNAME
spring.datasource.password=DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration for Password Dispatch
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=USERNAME
spring.mail.password=PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Custom JWT & Application Properties
app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
app.jwtExpirationMs=86400000
app.admin.password=PASSWORD

# Article cover image upload directory
app.upload.article-images=uploads/articles

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
